services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: geekyclouds-postgres
    environment:
      POSTGRES_DB: geekyclouds
      POSTGRES_USER: geekyclouds
      POSTGRES_PASSWORD: geekyclouds_local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geekyclouds -d geekyclouds"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
